[Principal]
kernel = /kernel/kernel.bin
modo_video = nativo
resolucao = auto
tempo_espera = 5

[Opcoes]
padrao = modo_grafico

[Entrada:Modo Gráfico]
rotulo = 🖥️ Iniciar FydelisTech OS — Modo Gráfico
comando = iniciar_grafico
descricao = Ambiente de trabalho completo com interface

[Entrada:Terminal]
rotulo = 💻 FydelTerm — Modo Texto
comando = iniciar_terminal
descricao = Apenas terminal de comando sem interface gráfica

[Entrada:Seguranca]
rotulo = 🛡️ Modo Manutenção / Segurança
comando = iniciar_seguro
descricao = Inicia sem drivers extras, apenas essencial

[Memoria]
usar_troca = sim
tamanho_troca = 2G
hibernacao = ativada

[Inicializacao]
tela_splash = sim
carregar_drivers = todos
log_nivel = detalhado
imagem_fundo = /fyd/boot/background.png
